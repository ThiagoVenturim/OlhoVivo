[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olhovivo"
version = "0.1.0"
description = "Decision support for parking enforcement: street rules plus dwell time over pluggable vehicle detections."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ThiagoVenturim" }]
dependencies = [
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
olhovivo = "olhovivo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/olhovivo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
"scripts/**" = ["S603", "S607", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
